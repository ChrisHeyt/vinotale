<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vinotale</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Montserrat',sans-serif;
    background:#faf8f4;
    color:#333;
}

/* Hero Section */

.hero{
    position:relative;
    width:100%;
    height:100vh;
    background:
        linear-gradient(
            rgba(0,0,0,0.35),
            rgba(0,0,0,0.35)
        ),
        url('hero.jpeg');
    background-size:cover;
    background-position:center center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero-content{
    max-width:900px;
    padding:20px;
}

.hero h1{
    font-family:'Cormorant Garamond', serif;
    color:white;
    font-size:clamp(3rem,7vw,6rem);
    font-weight:600;
    letter-spacing:1px;
    text-shadow:0 4px 20px rgba(0,0,0,0.4);
}

.hero p{
    margin-top:20px;
    font-size:clamp(1rem,2vw,1.4rem);
    color:white;
    font-weight:300;
    text-shadow:0 2px 10px rgba(0,0,0,0.4);
}

/* Intro */

.section{
    padding:100px 24px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.section h2{
    font-family:'Cormorant Garamond', serif;
    font-size:3rem;
    margin-bottom:20px;
    text-align:center;
}

.section p{
    max-width:800px;
    margin:auto;
    text-align:center;
    line-height:1.8;
    font-size:1.1rem;
}

/* Footer */

footer{
    background:#1d1d1d;
    color:white;
    text-align:center;
    padding:30px;
}

@media(max-width:768px){

    .hero{
        height:85vh;
    }

    .section{
        padding:60px 20px;
    }
}

</style>
</head>

<body>

<section class="hero">

    <div class="hero-content">
        <h1>Willkommen bei Vinotale.</h1>
       
    </div>

</section>


<footer>
    © 2026 Vinotale
</footer>

</body>
</html>
